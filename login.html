<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --fundo: #030306;
      --card: rgba(9, 7, 18, 0.78);
      --borda: rgba(255, 255, 255, 0.14);
      --texto: #f4f0ff;
      --muted: rgba(244, 240, 255, 0.68);
      --erro: #ff5c7a;
      --ok: #7cffc4;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 0, 120, 0.16), transparent 34%),
        radial-gradient(circle at 84% 76%, rgba(0, 200, 255, 0.16), transparent 36%),
        radial-gradient(circle at 52% 48%, rgba(138, 43, 226, 0.18), transparent 44%),
        linear-gradient(180deg, #05030b 0%, #000 100%);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -50%;
      background:
        conic-gradient(
          from 0deg,
          transparent,
          rgba(255, 0, 120, 0.08),
          rgba(0, 200, 255, 0.08),
          rgba(138, 43, 226, 0.08),
          transparent
        );
      animation: girarBrilho 14s linear infinite;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.18) 0 1px, transparent 1px),
        radial-gradient(circle at 70% 80%, rgba(255,255,255,.12) 0 1px, transparent 1px),
        radial-gradient(circle at 35% 55%, rgba(255,255,255,.10) 0 1px, transparent 1px);
      background-size: 34px 34px, 58px 58px, 92px 92px;
      opacity: 0.24;
      mix-blend-mode: screen;
      animation: ruido 1.6s steps(2) infinite;
    }

    .login-container {
      width: min(440px, 94vw);
      position: relative;
      z-index: 2;
      animation: surgir 1s ease forwards;
    }

    .login-card {
      position: relative;
      padding: clamp(26px, 5vw, 38px);
      border: 1px solid var(--borda);
      border-radius: 26px;
      background: var(--card);
      backdrop-filter: blur(16px);
      box-shadow:
        0 0 22px rgba(255, 0, 120, 0.18),
        0 0 44px rgba(0, 200, 255, 0.12),
        inset 0 0 28px rgba(255, 255, 255, 0.035);
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 1px;
      border-radius: inherit;
      background: linear-gradient(135deg, #ff0078, #00c8ff, #8a2be2, #ffdd55, #ff0078);
      background-size: 320% 320%;
      animation: moverCores 6s linear infinite;
      opacity: 0.54;
      pointer-events: none;
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask-composite: exclude;
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
    }

    .login-topo {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-titulo {
      font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif;
      font-size: clamp(2.7rem, 9vw, 4.4rem);
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #fff;
      text-shadow:
        0 0 10px rgba(255, 0, 120, 0.55),
        0 0 24px rgba(0, 200, 255, 0.28),
        0 0 42px rgba(138, 43, 226, 0.28);
    }

    .login-subtitulo {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.96rem;
      line-height: 1.45;
    }

    .campo {
      margin-bottom: 18px;
    }

    .campo label {
      display: block;
      margin-bottom: 8px;
      color: rgba(244, 240, 255, 0.86);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .campo input {
      width: 100%;
      height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      outline: none;
      background: rgba(0, 0, 0, 0.42);
      color: var(--texto);
      padding: 0 15px;
      font-size: 1rem;
      transition: 0.25s ease;
      box-shadow: inset 0 0 14px rgba(255, 255, 255, 0.025);
    }

    .campo input::placeholder {
      color: rgba(244, 240, 255, 0.36);
    }

    .campo input:focus {
      border-color: rgba(0, 200, 255, 0.72);
      box-shadow:
        0 0 0 3px rgba(0, 200, 255, 0.12),
        0 0 20px rgba(138, 43, 226, 0.18),
        inset 0 0 14px rgba(255, 255, 255, 0.035);
    }

    .senha-wrapper {
      position: relative;
    }

    .senha-wrapper input {
      padding-right: 96px;
    }

    .btn-senha {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      border: 0;
      border-radius: 10px;
      padding: 9px 11px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(244, 240, 255, 0.8);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-senha:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .mensagem {
      min-height: 22px;
      margin: -4px 0 14px;
      font-size: 0.88rem;
      line-height: 1.4;
      text-align: center;
      color: var(--muted);
    }

    .mensagem.erro {
      color: var(--erro);
    }

    .mensagem.ok {
      color: var(--ok);
    }

    .btn-login {
      width: 100%;
      min-height: 50px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(90deg, rgba(255, 0, 120, 0.75), rgba(0, 200, 255, 0.68), rgba(138, 43, 226, 0.75));
      background-size: 220% 220%;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-size: 0.9rem;
      font-weight: 900;
      cursor: pointer;
      transition: 0.25s ease;
      box-shadow:
        0 0 18px rgba(255, 0, 120, 0.24),
        0 0 26px rgba(0, 200, 255, 0.14);
      animation: moverCores 5s linear infinite;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 24px rgba(255, 0, 120, 0.36),
        0 0 36px rgba(0, 200, 255, 0.24),
        0 0 48px rgba(138, 43, 226, 0.18);
    }

    .login-rodape {
      margin-top: 18px;
      text-align: center;
      color: rgba(244, 240, 255, 0.5);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    @keyframes surgir {
      from {
        opacity: 0;
        transform: translateY(22px) scale(0.98);
        filter: blur(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes moverCores {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes girarBrilho {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes ruido {
      0% { transform: translate(0, 0); }
      50% { transform: translate(-1px, 1px); }
      100% { transform: translate(1px, -1px); }
    }

    @media (max-width: 480px) {
      body {
        overflow: auto;
      }

      .login-card {
        border-radius: 22px;
      }
    }

    /* =========================================================
       Ajuste responsivo global - celular e computador
       ========================================================= */
    html {
      width: 100%;
      max-width: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    img, svg, video, canvas {
      max-width: 100%;
      height: auto;
    }

    input, textarea, select, button {
      max-width: 100%;
    }

    button, a, input, textarea, select {
      -webkit-tap-highlight-color: transparent;
    }


    @supports (min-height: 100dvh) {
      body { min-height: 100dvh; }
    }

    @media (max-width: 520px), (max-height: 640px) {
      body {
        overflow: auto;
        align-items: flex-start;
        padding: 22px 14px;
      }

      .login-container {
        width: 100%;
      }

      .login-card {
        padding: 24px 16px;
        border-radius: 22px;
      }

      .login-topo {
        margin-bottom: 22px;
      }

      .login-titulo {
        font-size: clamp(2.5rem, 18vw, 3.7rem);
      }

      .senha-wrapper input {
        padding-right: 78px;
      }

      .btn-senha {
        right: 6px;
        padding: 8px 8px;
        font-size: .64rem;
      }
    }

  </style>
</head>

<body>
  <main class="login-container">
    <section class="login-card" aria-labelledby="loginTitulo">
      <div class="login-topo">
        <h1 id="loginTitulo" class="login-titulo">Login</h1>
        <p class="login-subtitulo">
          Informe seus dados para acessar o gerenciador de fichas.
        </p>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="campo">
          <label for="nome">Nome</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Seu nome"
            minlength="2"
            required
          />
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seuemail@exemplo.com"
            required
          />
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <div class="senha-wrapper">
            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Digite sua senha"
              minlength="6"
              required
            />
            <button type="button" class="btn-senha" id="toggleSenha">Mostrar</button>
          </div>
        </div>

        <p id="mensagemLogin" class="mensagem" aria-live="polite"></p>

        <button type="submit" class="btn-login">Entrar</button>
      </form>

      <p class="login-rodape">
        Este login usa Firebase Authentication. Se o e-mail ainda não existir, a conta será criada automaticamente.
      </p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { firebaseConfig, firebaseEstaConfigurado } from "./firebase-config.js";

    const form = document.getElementById('loginForm');
    const nomeInput = document.getElementById('nome');
    const emailInput = document.getElementById('email');
    const senhaInput = document.getElementById('senha');
    const mensagem = document.getElementById('mensagemLogin');
    const toggleSenha = document.getElementById('toggleSenha');

    const firebaseConfigurado = firebaseEstaConfigurado();
    const app = firebaseConfigurado ? initializeApp(firebaseConfig) : null;
    const auth = app ? getAuth(app) : null;
    const db = app ? getFirestore(app) : null;

    function mostrarMensagem(texto, tipo = '') {
      mensagem.className = 'mensagem';
      if (tipo) mensagem.classList.add(tipo);
      mensagem.textContent = texto;
    }

    function obterDestinoDepoisDoLogin() {
      const params = new URLSearchParams(window.location.search);
      const destinoUrl = params.get('redirect');
      const convitePendente = localStorage.getItem('conviteCampanhaPendente');

      if (destinoUrl) return destinoUrl;
      if (convitePendente) return convitePendente;
      return 'personagens.html';
    }

    function salvarUsuarioLocal(usuarioFirebase, nomeInformado = '') {
      const usuario = {
        uid: usuarioFirebase.uid,
        id: usuarioFirebase.uid,
        nome: nomeInformado || usuarioFirebase.displayName || usuarioFirebase.email?.split('@')[0] || 'Usuário',
        email: usuarioFirebase.email || '',
        logado: true,
        loginEm: new Date().toISOString()
      };

      localStorage.setItem('usuarioLogado', JSON.stringify(usuario));
      return usuario;
    }

    async function salvarUsuarioNoFirestore(usuarioFirebase, nome) {
      if (!db || !usuarioFirebase?.uid) return;

      try {
        await setDoc(doc(db, 'users', usuarioFirebase.uid), {
          uid: usuarioFirebase.uid,
          nome,
          email: usuarioFirebase.email || '',
          atualizadoEm: serverTimestamp(),
          criadoEm: serverTimestamp()
        }, { merge: true });
      } catch (erro) {
        // O login/cadastro não deve falhar só porque as regras do Firestore
        // ainda não permitem salvar o perfil do usuário.
        console.warn('Login realizado, mas não consegui salvar o perfil no Firestore:', erro);
      }
    }

    function tratarErroFirebase(erro) {
      const codigo = erro?.code || '';

      if (codigo === 'auth/wrong-password' || codigo === 'auth/invalid-credential' || codigo === 'auth/invalid-login-credentials') {
        return 'Não consegui entrar com esses dados. Se o e-mail já existe, confira a senha.';
      }

      if (codigo === 'auth/invalid-email') {
        return 'Informe um e-mail válido.';
      }

      if (codigo === 'auth/weak-password') {
        return 'A senha precisa ter pelo menos 6 caracteres.';
      }

      if (codigo === 'auth/email-already-in-use') {
        return 'Este e-mail já existe. Tente entrar com a senha cadastrada.';
      }

      if (codigo === 'auth/operation-not-allowed') {
        return 'Ative Email/senha em Firebase Authentication > Sign-in method.';
      }

      if (codigo === 'auth/configuration-not-found') {
        return 'O Firebase Authentication ainda não foi configurado neste projeto.';
      }

      if (codigo === 'auth/unauthorized-domain') {
        return 'Este domínio não está autorizado no Firebase Authentication.';
      }

      if (codigo === 'auth/too-many-requests') {
        return 'Muitas tentativas. Aguarde um pouco e tente novamente.';
      }

      return `Não consegui fazer login agora. Código: ${codigo || 'erro desconhecido'}.`;
    }

    toggleSenha.addEventListener('click', () => {
      const senhaEstaOculta = senhaInput.type === 'password';
      senhaInput.type = senhaEstaOculta ? 'text' : 'password';
      toggleSenha.textContent = senhaEstaOculta ? 'Ocultar' : 'Mostrar';
    });

    if (!firebaseConfigurado) {
      mostrarMensagem('Configure o arquivo firebase-config.js para ativar o login real pelo Firebase.', 'erro');
    }

    if (auth) {
      onAuthStateChanged(auth, (usuarioFirebase) => {
        if (!usuarioFirebase) return;

        const nomeAtual = usuarioFirebase.displayName || '';
        if (nomeAtual && !nomeInput.value.trim()) nomeInput.value = nomeAtual;
        if (usuarioFirebase.email && !emailInput.value.trim()) emailInput.value = usuarioFirebase.email;
      });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const nome = nomeInput.value.trim();
      const email = emailInput.value.trim().toLowerCase();
      const senha = senhaInput.value.trim();

      mostrarMensagem('');

      if (nome.length < 2) {
        mostrarMensagem('Informe um nome válido.', 'erro');
        nomeInput.focus();
        return;
      }

      if (!email.includes('@') || !email.includes('.')) {
        mostrarMensagem('Informe um e-mail válido.', 'erro');
        emailInput.focus();
        return;
      }

      if (senha.length < 6) {
        mostrarMensagem('A senha precisa ter pelo menos 6 caracteres.', 'erro');
        senhaInput.focus();
        return;
      }

      if (!firebaseConfigurado || !auth || !db) {
        mostrarMensagem('Firebase ainda não configurado. Preencha o firebase-config.js.', 'erro');
        return;
      }

      form.querySelector('button[type="submit"]').disabled = true;
      mostrarMensagem('Conectando ao Firebase...');

      try {
        let credencial;

        try {
          credencial = await signInWithEmailAndPassword(auth, email, senha);
        } catch (erroLogin) {
          const codigoLogin = erroLogin?.code || '';

          // Em versões recentes do Firebase, quando o e-mail não existe,
          // o erro pode vir como auth/invalid-credential em vez de auth/user-not-found.
          // Por isso tentamos criar a conta. Se o e-mail já existir, o Firebase
          // devolve auth/email-already-in-use e mostramos a mensagem correta.
          if (
            codigoLogin === 'auth/user-not-found' ||
            codigoLogin === 'auth/invalid-credential' ||
            codigoLogin === 'auth/invalid-login-credentials'
          ) {
            try {
              mostrarMensagem('Conta não encontrada. Criando cadastro...');
              credencial = await createUserWithEmailAndPassword(auth, email, senha);
            } catch (erroCadastro) {
              if (erroCadastro?.code === 'auth/email-already-in-use') {
                throw erroLogin;
              }

              throw erroCadastro;
            }
          } else {
            throw erroLogin;
          }
        }

        if (credencial.user.displayName !== nome) {
          try {
            await updateProfile(credencial.user, { displayName: nome });
          } catch (erroPerfil) {
            console.warn('Login realizado, mas não consegui atualizar o nome do perfil:', erroPerfil);
          }
        }

        await salvarUsuarioNoFirestore(credencial.user, nome);
        salvarUsuarioLocal(credencial.user, nome);

        mostrarMensagem('Login realizado. Redirecionando...', 'ok');

        const destino = obterDestinoDepoisDoLogin();
        localStorage.removeItem('conviteCampanhaPendente');

        setTimeout(() => {
          window.location.href = destino;
        }, 500);
      } catch (erro) {
        console.error('Erro no login Firebase:', erro);
        mostrarMensagem(tratarErroFirebase(erro), 'erro');
        form.querySelector('button[type="submit"]').disabled = false;
      }
    });
  </script>
</body>
</html>
